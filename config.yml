# Pipeline configuration.
#
# Settings that change results live here rather than in the scripts, so a run can be
# described completely by this file plus data/raw/MANIFEST.json. Sections are added as
# the tasks that use them are built.

paths:
  gtfs: data/raw/gtfs.zip
  osm_source: data/raw/nebraska-latest.osm.pbf
  osm_clipped: data/processed/lincoln.osm.pbf
  grid: data/processed/grid.gpkg

network:
  # The OSM clip is the GTFS stop extent plus this buffer. A stop near the edge of the
  # box still needs the streets around it for walk access and egress; walk legs are
  # capped at ~800 m, so 5 km is generous, but the clip is cheap and a street network
  # truncated at the edge fails silently (trips just look worse), not loudly.
  bbox_buffer_km: 5

  # Ceiling for the R5 JVM heap. r5py's default is 80% of *total* RAM (~12 GB on a
  # 16 GB machine) regardless of what else is running; if R5 grew past free memory,
  # Windows would page to disk. A network the size of Lincoln fits well within 4 G.
  # If R5 reports OutOfMemoryError, raise this.
  jvm_max_memory: 4G

grid:
  # Destination grid: travel time is computed from each origin to the centroid of every
  # cell. 150 m is about a short city block, fine enough that isochrone edges don't look
  # like staircases, while keeping the cell count in the tens of thousands.
  cell_size_m: 150

  # Cells are laid out in UTM zone 14N, a metric projection that is nearly
  # distortion-free over Lincoln, so every cell really is 150 m square. Centroids
  # are converted to WGS84 for r5py.
  crs: EPSG:32614
