# Pipeline configuration.
#
# Settings that change results live here rather than in the scripts, so a run can be
# described completely by this file plus data/raw/MANIFEST.json. Sections are added as
# the tasks that use them are built.

paths:
  gtfs: data/raw/gtfs.zip
  osm_source: data/raw/nebraska-latest.osm.pbf
  osm_clipped: data/processed/lincoln.osm.pbf
  grid: data/processed/grid.gpkg
  origins: data/origins.csv

network:
  # The OSM clip is the GTFS stop extent plus this buffer. A stop near the edge of the
  # box still needs the streets around it for walk access and egress; walk legs are
  # capped at ~800 m, so 5 km is generous, but the clip is cheap and a street network
  # truncated at the edge fails silently (trips just look worse), not loudly.
  bbox_buffer_km: 5

  # Ceiling for the R5 JVM heap. r5py's default is 80% of *total* RAM (~12 GB on a
  # 16 GB machine) regardless of what else is running; if R5 grew past free memory,
  # Windows would page to disk. A network the size of Lincoln fits well within 4 G.
  # If R5 reports OutOfMemoryError, raise this.
  jvm_max_memory: 4G

grid:
  # Destination grid: travel time is computed from each origin to the centroid of every
  # cell. 150 m is about a short city block, fine enough that isochrone edges don't look
  # like staircases, while keeping the cell count in the tens of thousands.
  cell_size_m: 150

  # Cells are laid out in UTM zone 14N, a metric projection that is nearly
  # distortion-free over Lincoln, so every cell really is 150 m square. Centroids
  # are converted to WGS84 for r5py.
  crs: EPSG:32614

  # Cells farther than this (straight line) from every stop are dropped before routing.
  # With TRANSIT + WALK, R5 caps *all* walking at max_time_walking, including a trip
  # that walks the whole way, so a cell can only be reached if it lies within one walk
  # leg of a stop. Tested 2026-09-15 from downtown: the farthest reachable cell was
  # 781 m from a stop. (WALK-only routing ignores the cap and reached cells 1.7 km
  # from any stop, but this project never routes walk-only.) 1,000 m leaves margin.
  max_distance_to_stop_m: 1000

routing:
  # 4.7 km/h (1.31 m/s): the usual outdoor walking pace of healthy adults, from a
  # meta-analysis of 35 studies and 14,015 participants ("Outdoor Walking Speeds of
  # Apparently Healthy Adults: A Systematic Review and Meta-analysis", PubMed 33030707).
  # r5py's own default is 3.6 km/h, so this must always be set.
  speed_walking_kmh: 4.7

  # Cap on every walk leg: to the first stop, between stops, from the last stop. With
  # TRANSIT + WALK it also caps a trip that walks the whole way. 10 min at 4.7 km/h is
  # about 780 m.
  max_walk_minutes: 10

  # R5 routes a departure every minute of this window and reports percentiles of the
  # results; the maps show the median. r5py's default window is 10 minutes, so this must
  # always be set.
  departure_time_window_minutes: 60
  percentiles: [25, 50, 75]

  # Trips longer than this count as unreachable. The last travel-time band ends here.
  max_time_minutes: 60
  bands_minutes: [15, 30, 45, 60]

# Scenario dates are real calendar days. compute_isochrones.py checks each against the
# feed (right weekday, inside the calendar, no calendar_dates exception) before
# routing. All four fall in one ordinary week near the start of feed 20260828, whose
# only exception is Labor Day, 2026-09-07.
#
# The evening scenarios are Tuesday 8pm and Saturday 5pm, not 9pm and 6pm. Weekday
# service ends around 9:50pm and Saturday service around 7:35pm, so a 60-minute window
# starting at 9pm or 6pm is mostly empty, and its median wouldn't be comparable to the
# morning's (see Task 0 in methodology.md).
scenarios:
  - id: tue_0800
    label: Tuesday 8am
    weekday: Tuesday
    date: "2026-09-15"
    time: "08:00"
  - id: tue_2000
    label: Tuesday 8pm
    weekday: Tuesday
    date: "2026-09-15"
    time: "20:00"
  - id: sat_1700
    label: Saturday 5pm
    weekday: Saturday
    date: "2026-09-19"
    time: "17:00"
  - id: sun_1200
    label: Sunday noon
    weekday: Sunday
    date: "2026-09-20"
    time: "12:00"

# Task 5 rendering. Values here are metric like the rest of the pipeline; src/units.py
# converts everything a reader sees into miles and square miles.
render:
  dpi: 200                    # the archive/print PNG
  web_width_px: 2400          # the WebP the site serves
  # Gaussian smoothing applied to the travel-time surface before contouring, in grid
  # cells. It hides the 150 m staircase edges at the cost of a few hundred feet of edge
  # precision. Set to 0 for "honest pixels": every square drawn exactly as computed.
  smoothing_sigma_cells: 1.0
  # Each figure's four panels share one extent, fitted to that origin's reach. Small
  # reaches (Briarpark) would otherwise be zoomed in absurdly far, so the view never
  # gets narrower than this. Scale differs between origins, hence the scale bar.
  min_extent_miles: 5

# The basemap is drawn from our own OSM extract, cached to data/processed/basemap.gpkg.
# (Tiles were tried first: CartoDB now requires an API key, and its tiles come back
# watermarked without one.) OSM has 921 water bodies and 484 parks in the clip, mostly
# retention ponds and pocket parks, so both are filtered by area.
basemap:
  min_water_hectares: 4
  min_park_hectares: 6

# Orientation labels, drawn on every panel. Coordinates taken from the OSM extract.
landmarks:
  - {name: Downtown, lat: 40.81465, lon: -96.70586}
  - {name: UNL City Campus, lat: 40.82069, lon: -96.70558}
  - {name: UNL East Campus, lat: 40.82951, lon: -96.66989}
  - {name: Airport, lat: 40.84903, lon: -96.75776}
  - {name: Gateway Mall, lat: 40.81545, lon: -96.63616}
  - {name: Bryan East, lat: 40.79694, lon: -96.65111}
  - {name: Pioneers Park, lat: 40.77749, lon: -96.77586}
  - {name: SouthPointe, lat: 40.74233, lon: -96.67821}

# Hand-written notes on individual panels: the fact behind what the map shows.
# Keyed by origin slug (data/origins.csv) then scenario id (above). At most one per
# panel, one short line of roughly 30 characters. Sunday panels get "No buses run on
# Sundays" automatically. Look times up with `python src/stop_schedule.py` -- every
# figure in a callout must come from the feed. Example:
#
# callouts:
#   bryan-east:
#     tue_2000: "Last bus left 7:46pm"
callouts:
  bryan-east:
    tue_2000: "Last bus left 7:46pm"      # stop 786, weekday: 27 departures, last 7:46pm
  s40th-briarpark:
    tue_2000: "Last bus left 6:26pm"      # stop 733, weekday: hourly at :26, last 6:26pm
  unl-east-campus:
    sat_1700: "No Saturday buses here"    # stop 485: 0 Saturday departures; the map's
                                          # reach comes from walking to other stops
